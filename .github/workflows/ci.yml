name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mirk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIRK_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/mirk_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check public documentation
        run: pnpm docs:check

      - name: Install browser test runtime
        run: pnpm --filter @mirk/surreal exec playwright install --with-deps chromium

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test --reporter=verbose
