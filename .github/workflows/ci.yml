name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mirk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIRK_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/mirk_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check public documentation
        run: pnpm docs:check

      - name: Install browser test runtime
        run: pnpm --filter @mirk/surreal exec playwright install --with-deps chromium

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test --reporter=verbose

      # The corpus is generated. This regenerates into a temporary tree and
      # diffs, so a hand-edited or stale scenario fails here rather than being
      # replayed as contract by both languages.
      - name: Conformance corpus is current
        run: pnpm conformance:current

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Explicit, so the run fails on a broken lock rather than in the middle of
      # a test step. The Python compat tests shell out to node against the built
      # `@mirk/store` dist, which the install and build steps above already
      # produced in this job.
      - name: Install Python dev dependencies
        working-directory: python/store
        run: uv sync --group dev

      # The Python port replays the same corpus. Running only the TypeScript
      # suite would let the two implementations drift apart between commits,
      # which is the one thing the corpus exists to prevent.
      - name: Python tests
        working-directory: python/store
        run: uv run pytest -q

      - name: Python typecheck
        working-directory: python/store
        run: uv run pyright

      - name: Python lint
        working-directory: python/store
        run: uv run ruff check .

      - name: Verify packed package releases
        run: pnpm release:verify -- --all --skip-build --skip-test --skip-typecheck --receipt-dir .mirk-release

      - name: Upload release receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirk-release-receipts
          path: .mirk-release/
          if-no-files-found: ignore
