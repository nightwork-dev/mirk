name: Qdrant vector adapters

on:
  push:
    paths:
      - "packages/vector-qdrant/**"
      - "packages/store/**"
      - "python/vector-qdrant/**"
      - "python/store/**"
      - "conformance/vector/**"
      - "python/pyproject.toml"
      - "python/uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/run-qdrant-tests.py"
      - "scripts/qdrant-exchange.mjs"
      - ".github/workflows/qdrant.yml"
  pull_request:
    paths:
      - "packages/vector-qdrant/**"
      - "packages/store/**"
      - "python/vector-qdrant/**"
      - "python/store/**"
      - "conformance/vector/**"
      - "python/pyproject.toml"
      - "python/uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/run-qdrant-tests.py"
      - "scripts/qdrant-exchange.mjs"
      - ".github/workflows/qdrant.yml"

permissions:
  contents: read

jobs:
  qdrant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python workspace dependencies
        run: uv sync --project python --all-packages --locked --all-groups

      - name: Build workspace
        run: pnpm -r build

      - name: Install Python wheels in a clean environment
        run: |
          uv build --project python --package mirk-store --wheel --out-dir "$RUNNER_TEMP/qdrant-wheels"
          uv build --project python --package mirk-vector-qdrant --wheel --out-dir "$RUNNER_TEMP/qdrant-wheels"
          uv export --project python --package mirk-vector-qdrant --all-groups --locked --no-emit-workspace --no-hashes --output-file "$RUNNER_TEMP/qdrant-requirements.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/qdrant-installed"
          uv pip install --python "$RUNNER_TEMP/qdrant-installed/bin/python" --requirements "$RUNNER_TEMP/qdrant-requirements.txt" "$RUNNER_TEMP"/qdrant-wheels/*.whl
          echo "MIRK_QDRANT_PYTHON=$RUNNER_TEMP/qdrant-installed/bin/python" >> "$GITHUB_ENV"

      - name: Run native Qdrant adapter tests
        run: python scripts/run-qdrant-tests.py
