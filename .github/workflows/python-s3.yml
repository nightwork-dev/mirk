name: Python S3 artifact adapter

on:
  push:
    paths:
      - "python/**"
      - "scripts/run-python-s3-tests.py"
      - ".github/workflows/python-s3.yml"
  pull_request:
    paths:
      - "python/**"
      - "scripts/run-python-s3-tests.py"
      - ".github/workflows/python-s3.yml"

permissions:
  contents: read

jobs:
  s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
          cache: false
      - uses: astral-sh/setup-uv@v7

      - name: Build pinned MinIO server
        env:
          MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
          MINIO_COMMIT: 9e49d5e7a648
        run: |
          mkdir -p "$RUNNER_TEMP/minio-bin"
          CGO_ENABLED=0 GOBIN="$RUNNER_TEMP/minio-bin" go install -ldflags "-X github.com/minio/minio/cmd.ReleaseTag=$MINIO_VERSION -X github.com/minio/minio/cmd.Version=$MINIO_VERSION -X github.com/minio/minio/cmd.CommitID=$MINIO_COMMIT -X github.com/minio/minio/cmd.ShortCommitID=$MINIO_COMMIT" "github.com/minio/minio@$MINIO_VERSION"
          "$RUNNER_TEMP/minio-bin/minio" --version
          echo "MINIO_BINARY=$RUNNER_TEMP/minio-bin/minio" >> "$GITHUB_ENV"

      - name: Sync Python workspace
        run: uv sync --project python --all-packages --locked --all-groups

      - name: Run real S3 artifact tests
        run: python scripts/run-python-s3-tests.py
