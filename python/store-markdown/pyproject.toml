[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mirk-store-markdown"
version = "0.1.0"
description = "Human-editable Markdown and YAML headmatter adapter for Mirk."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mirk-store>=0.1.0,<0.2", "ruamel.yaml>=0.18,<0.19"]

[project.urls]
Homepage = "https://github.com/nightwork-dev/mirk/tree/main/python/store-markdown"
Repository = "https://github.com/nightwork-dev/mirk"

[tool.uv.sources]
mirk-store = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/mirk"]

[tool.hatch.build.targets.sdist]
include = ["README.md", "LICENSE", "pyproject.toml", "src/mirk", "tests"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N802", "N803", "N815"]

[tool.pytest.ini_options]
testpaths = ["tests"]
