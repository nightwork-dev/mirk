<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="320" rx="14" fill="url(#bg)"/>

  <!-- three cards: w=240 h=104 y=58 ; interfaces x=60 cx=180, node-sqlite x=330 cx=450, sqlite x=600 cx=720 -->
  <g>
    <rect x="60" y="58" width="240" height="104" rx="13" fill="#0e1626" stroke="#243250" stroke-width="1.5"/>
    <rect x="60" y="58" width="240" height="4" rx="2" fill="#2bd4ff"/>
    <text x="180" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#eaf1ff">@mirk/store/kv, /vector, …</text>
    <text x="180" y="120" text-anchor="middle" font-size="12.5" fill="#8aa0c4">interfaces + in-memory stores</text>
    <text x="180" y="140" text-anchor="middle" font-size="12.5" fill="#8aa0c4">kv · vector · search · log · atomic</text>
  </g>
  <g>
    <rect x="330" y="58" width="240" height="104" rx="13" fill="#0e1626" stroke="#243250" stroke-width="1.5"/>
    <rect x="330" y="58" width="240" height="4" rx="2" fill="#2bd4ff"/>
    <text x="450" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#eaf1ff">@mirk/store/node-sqlite</text>
    <text x="450" y="120" text-anchor="middle" font-size="12.5" fill="#8aa0c4">NodeSqliteAdapter</text>
    <text x="450" y="140" text-anchor="middle" font-size="12.5" fill="#8aa0c4">Node 24's built-in node:sqlite</text>
  </g>
  <g>
    <rect x="600" y="58" width="240" height="104" rx="13" fill="#0e1626" stroke="#3a2415" stroke-width="1.5"/>
    <rect x="600" y="58" width="240" height="4" rx="2" fill="#ff7a18"/>
    <text x="720" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#ffd9b8">@mirk/store/sqlite</text>
    <text x="720" y="120" text-anchor="middle" font-size="12.5" fill="#caa183">SqliteAdapter</text>
    <text x="720" y="140" text-anchor="middle" font-size="12.5" fill="#caa183">on better-sqlite3</text>
  </g>

  <!-- verdicts under each -->
  <text x="180" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#9ce8ff">zero native deps</text>
  <text x="450" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#9ce8ff">nothing to install</text>
  <g>
    <rect x="602" y="186" width="236" height="40" rx="9" fill="#16100a" stroke="#3a2415" stroke-width="1.5"/>
    <text x="720" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#ffce9e">native — optional peer</text>
    <text x="720" y="219" text-anchor="middle" font-size="11.5" fill="#caa183">better-sqlite3 11, 12 or 13</text>
  </g>

  <text x="450" y="268" text-anchor="middle" font-size="13" fill="#6f84a8">Import an interface subpath and no native binding enters your bundle — native code loads only from adapter subpaths.</text>
  <text x="450" y="292" text-anchor="middle" font-size="12.5" fill="#6f84a8">Optional: @mirk/store/sqlite-vec with @mirk/sqlite-vec-native runs vector search natively in either adapter.</text>
</svg>
