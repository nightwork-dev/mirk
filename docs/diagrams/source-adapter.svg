<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"
     font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="360" rx="14" fill="url(#bg)"/>

  <!-- four facet cards: w=180 h=120 y=66 ; x=60,260,460,660 ; cx=150,350,550,750 -->
  <g>
    <rect x="60" y="66" width="180" height="120" rx="13" fill="#0e1626" stroke="#243250" stroke-width="1.5"/>
    <rect x="60" y="66" width="180" height="4" rx="2" fill="#2bd4ff"/>
    <text x="150" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf1ff">.kv</text>
    <text x="150" y="134" text-anchor="middle" font-size="13" fill="#9ce8ff">SyncStore</text>
    <text x="150" y="155" text-anchor="middle" font-size="12.5" fill="#8aa0c4">key-value + collections</text>
  </g>
  <g>
    <rect x="260" y="66" width="180" height="120" rx="13" fill="#0e1626" stroke="#243250" stroke-width="1.5"/>
    <rect x="260" y="66" width="180" height="4" rx="2" fill="#2bd4ff"/>
    <text x="350" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf1ff">.vector</text>
    <text x="350" y="134" text-anchor="middle" font-size="13" fill="#9ce8ff">VectorStore</text>
    <text x="350" y="155" text-anchor="middle" font-size="12.5" fill="#8aa0c4">exact cosine · named spaces</text>
  </g>
  <g>
    <rect x="460" y="66" width="180" height="120" rx="13" fill="#0e1626" stroke="#243250" stroke-width="1.5"/>
    <rect x="460" y="66" width="180" height="4" rx="2" fill="#2bd4ff"/>
    <text x="550" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf1ff">.search</text>
    <text x="550" y="134" text-anchor="middle" font-size="13" fill="#9ce8ff">SearchStore</text>
    <text x="550" y="155" text-anchor="middle" font-size="12.5" fill="#8aa0c4">BM25 full-text search</text>
  </g>
  <g>
    <rect x="660" y="66" width="180" height="120" rx="13" fill="#0e1626" stroke="#243250" stroke-width="1.5"/>
    <rect x="660" y="66" width="180" height="4" rx="2" fill="#2bd4ff"/>
    <text x="750" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#eaf1ff">.log</text>
    <text x="750" y="134" text-anchor="middle" font-size="13" fill="#9ce8ff">LogStore</text>
    <text x="750" y="155" text-anchor="middle" font-size="12.5" fill="#8aa0c4">append-only streams</text>
  </g>

  <!-- every facet rides one connection: thin cyan rules from foundation (y=240) up to card bottoms (y=186) -->
  <line x1="150" y1="186" x2="150" y2="240" stroke="#2bd4ff" stroke-width="2" opacity="0.8"/>
  <line x1="350" y1="186" x2="350" y2="240" stroke="#2bd4ff" stroke-width="2" opacity="0.8"/>
  <line x1="550" y1="186" x2="550" y2="240" stroke="#2bd4ff" stroke-width="2" opacity="0.8"/>
  <line x1="750" y1="186" x2="750" y2="240" stroke="#2bd4ff" stroke-width="2" opacity="0.8"/>

  <!-- foundation: the one SQLite connection ; w=780 h=72 y=240 cx=450 -->
  <g>
    <rect x="60" y="240" width="780" height="72" rx="13" fill="#0e1626" stroke="#3a2415" stroke-width="1.5"/>
    <rect x="60" y="240" width="780" height="4" rx="2" fill="#ff7a18"/>
    <text x="450" y="276" text-anchor="middle" font-size="19" font-weight="700" fill="#ffd9b8">SqliteAdapter · NodeSqliteAdapter</text>
    <text x="450" y="298" text-anchor="middle" font-size="12.5" fill="#caa183">one SQLite connection (better-sqlite3 or Node's built-in node:sqlite) · one transaction across every facet</text>
  </g>

  <text x="450" y="342" text-anchor="middle" font-size="13" fill="#6f84a8">The in-memory stores implement the same interfaces with no native code.</text>
</svg>
